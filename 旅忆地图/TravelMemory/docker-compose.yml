# 单文件 + profiles：按阶段启用，不维护多套 compose 文件
#
#   阶段 0~2 : docker compose up -d
#   阶段 3~5 : docker compose --profile stage3 up -d
#   阶段 6+  : docker compose --profile stage3 --profile stage6 up -d
#   部署     : docker compose --profile stage3 --profile stage6 --profile prod up -d
#
# ⚠ 编码要求（Windows 踩过坑）：本文件必须保存为「UTF-8 无 BOM」。
#    带 BOM 时 Docker 会报 `invalid trailing UTF-8 octet`，且报错信息看不出是 BOM 引起的。

services:
  db:
    # build 而非 image：PostGIS 与 pgvector 官方都没有合一镜像，必须自建
    build: ./backend/docker/db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: travel_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d travel_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["stage3"]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: quay.io/minio/minio
    profiles: ["stage6"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db

volumes:
  pgdata:
  redisdata:
  miniodata: