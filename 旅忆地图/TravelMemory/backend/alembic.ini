# Alembic configuration
# Run: cd backend && alembic upgrade head
#
# NOTE: keep this file pure ASCII (no Chinese comments!).
# Alembic reads it with encoding="locale"; on Chinese Windows the locale is GBK,
# so any UTF-8 Chinese byte here raises:
#   UnicodeDecodeError: 'gbk' codec can't decode byte ...
# The DB URL is NOT hardcoded here - it comes from .env via app/core/config.py,
# so there is only one source of truth for the connection string.

[alembic]
script_location = alembic
prepend_sys_path = .
# version_path_separator = os
# file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
