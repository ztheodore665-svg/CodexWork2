name: ci

# 阶段 16 的第一件事：把「红线靠自觉」换成「红线靠退出码」。
#
# 四个 job 的分工：
#   backend-lint  → ruff + mypy（快，先失败）
#   backend-test  → 真 Postgres（pgvector 镜像）+ alembic + 全量 pytest
#   web           → 全工作区 typecheck + vitest + 跨包边界检查
#   docs          → 阶段索引与目录是否一致
#
# 为什么 backend 要带数据库：`tests/conftest.py` 里 10 个文件依赖真实库，
# 本地没库时它们会 skip —— 也就是说 trips/photos 的全部 HTTP 路径
# 在默认开发环境下根本没有回归保护。CI 不给库，这些用例永远是绿的假象。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Mypy
        working-directory: backend
        run: mypy app

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: travel_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d travel_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@127.0.0.1:5432/travel_memory
      EMBEDDING_DIM: "1024"
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q --junit-xml=pytest.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: backend/pytest.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Import boundaries
        run: node tools/check-import-boundaries.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage index
        run: python tools/check_stage_index.py
      - name: Generated constants
        run: python tools/gen_semantic_tags.py --check
