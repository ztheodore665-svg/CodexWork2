<!doctype html>
<html lang="zh-CN" data-entry="standalone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <meta name="color-scheme" content="dark" />
    <title>信物制作 · TrailShare</title>
    <style>
      /* 首屏骨架：React 挂载前有东西可看，避免白闪。挂载后整块被替换。 */
      html,
      body {
        margin: 0;
        background: #04070d;
      }
      #root > .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04070d;
      }
      #root > .boot span {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.36em;
        color: #22405c;
        text-transform: uppercase;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span>TRAILSHARE</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
