<!doctype html>
<!-- data-entry 决定 main.tsx 加载哪套主题：standalone = 深色独立版（零网络）+ 无高德 CSP。 -->
<html lang="zh-CN" data-entry="standalone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <meta name="color-scheme" content="dark" />
    <title>轨迹演示 · Track Studio</title>
    <style>
      /* 首屏骨架：React 挂载前有东西可看，避免白闪。挂载后整块被替换。
         `html, body, #root { height: 100% }` 是深色主题的前提：它的样式表被整体
         收进 `.theme-dark` 作用域（阶段 13），所以根链路上的高度只能由这里给。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04070d;
      }
      #root {
        height: 100%;
      }
      #root > .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04070d;
      }
      #root > .boot span {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.36em;
        color: #22405c;
        text-transform: uppercase;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span>TRACK STUDIO</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
