<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配时枚举优化 - SUMO 评价平台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #3498db; --success: #27ae60; --warning: #f39c12; --danger: #e74c3c;
  --bg: #f0f2f5; --surface: #fff; --border: #dcdde1; --text: #2c3e50;
  --text-secondary: #7f8c8d; --shadow: 0 2px 8px rgba(0,0,0,0.08); --radius: 8px;
}
body { font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
#header {
  display:flex; align-items:center; gap:10px; padding:10px 20px;
  background: linear-gradient(135deg,#1a1a2e,#16213e); color:#fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15); flex-wrap: wrap;
}
#header h1 { font-size:18px; font-weight:700; white-space:nowrap; }
#header .sep { width:1px; height:26px; background:rgba(255,255,255,0.2); }
#header select { padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:#fff; font-size:13px; }
#header select option { background:#1a1a2e; color:#fff; }
.link { color:#5dade2; text-decoration:none; font-size:13px; margin-left:auto; }
.link:hover { text-decoration:underline; }
#main { display:flex; height:calc(100vh - 52px); }
#sidebar { width:360px; min-width:360px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; }
#content { flex:1; overflow-y:auto; padding:20px; }
.section { padding:16px; border-bottom:1px solid var(--border); }
.section h3 { font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section h3::before { content:''; width:4px; height:16px; background:var(--primary); border-radius:2px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
.form-group input[type="number"] { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; }
.form-group input[type="number"]:focus { outline:none; border-color:var(--primary); }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:6px; border:none; cursor:pointer;
  font-size:13px; font-weight:600; width:100%; margin-bottom:8px; transition:all .15s;
}
.btn:hover { transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-outline { background:var(--surface); color:var(--text); border:1px solid var(--border); }
.phase-card { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fafbfc; }
.phase-card .phase-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.phase-card .phase-name { font-weight:600; font-size:13px; }
.phase-card .phase-dur { font-size:12px; color:var(--text-secondary); }
.phase-card .phase-row { display:flex; gap:8px; align-items:flex-end; }
.phase-card select { padding:6px; border:1px solid var(--border); border-radius:6px; font-size:12px; }
.phase-card input[type="number"] { width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; }
.phase-card .field { flex:1; }
.phase-card .field label { font-size:11px; color:var(--text-secondary); margin-bottom:2px; display:block; }
.panel { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden; }
.panel-header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--border); background:#fafbfc; }
.panel-header h3 { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.panel-header h3::before { content:''; width:4px; height:18px; background:var(--primary); border-radius:2px; }
.panel-body { padding:16px 20px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 12px; background:#f8f9fc; border-bottom:2px solid var(--border); font-size:12px; color:var(--text-secondary); font-weight:700; }
td { padding:9px 12px; border-bottom:1px solid #f0f0f5; }
tr:hover td { background:#f8f9fc; }
.badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; color:#fff; }
.badge-good { background:var(--success); }
.badge-bad { background:var(--danger); }
.badge-base { background:var(--text-secondary); }
#status-bar { display:flex; align-items:center; gap:10px; padding:8px 20px; background:var(--surface); border-top:1px solid var(--border); font-size:12px; color:var(--text-secondary); }
#status-bar .dot { width:8px; height:8px; border-radius:50%; background:#bdc3c7; }
#status-bar .dot.running { background:var(--warning); animation:pulse 1s infinite; }
#status-bar .dot.done { background:var(--success); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
#toast { position:fixed; bottom:24px; right:24px; padding:12px 24px; border-radius:8px; color:#fff; font-size:14px; font-weight:500; box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:999; transform:translateY(120px); opacity:0; transition:all .3s; max-width:420px; }
#toast.show { transform:translateY(0); opacity:1; }
#toast.success { background:var(--success); }
#toast.error { background:var(--danger); }
#toast.info { background:var(--primary); }
.chip { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; margin-right:4px; }
.chip.cycle { background:#e8f4fd; color:var(--primary); }
.empty { text-align:center; color:var(--text-secondary); padding:40px; }
.candidate-row { cursor:pointer; }
.detail-block { background:#fafbfc; padding:12px 16px; font-size:12px; line-height:1.8; }
.score-bar { height:8px; background:#ecf0f1; border-radius:4px; overflow:hidden; min-width:80px; }
.score-bar .fill { height:100%; background:var(--primary); border-radius:4px; }
</style>
</head>
<body>

<div id="header">
  <h1>⚙ 配时枚举优化</h1>
  <span class="sep"></span>
  <label style="font-size:13px;opacity:.8;">项目:</label>
  <select id="project-select">
    <option value="">-- 选择项目 --</option>
    {% for p in projects %}
    <option value="{{ p.path }}">{{ p.name }} ({{ p.intersection_count }}个路口)</option>
    {% endfor %}
  </select>
  <label style="font-size:13px;opacity:.8;">路口:</label>
  <select id="intersection-select"><option value="">-- 先选项目 --</option></select>
  <span id="import-badge" style="display:none;font-size:12px;background:#27ae6040;padding:4px 10px;border-radius:12px;">已从主页面导入路口</span>
  <a class="link" href="/">← 返回主页面</a>
</div>

<div id="main">
  <div id="sidebar">
    <div class="section">
      <h3>相位参数配置</h3>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">
        每个相位可选择 <b>固定</b>（锁定绿灯时长）或 <b>枚举</b>（在范围内搜索），其余相位动态调整以达最优。
      </div>
      <div id="phase-list"></div>
    </div>

    <div class="section">
      <h3>枚举参数</h3>
      <div class="form-group">
        <label>绿灯步长（秒）</label>
        <input type="number" id="param-step" value="15" min="5" max="60">
      </div>
      <div class="form-group">
        <label>目标周期（秒，可多选）</label>
        <div id="cycle-options">
          <label style="display:block;font-size:13px;margin:4px 0;"><input type="checkbox" value="90"> 90s（快速路口）</label>
          <label style="display:block;font-size:13px;margin:4px 0;"><input type="checkbox" value="120" checked> 120s（推荐）</label>
          <label style="display:block;font-size:13px;margin:4px 0;"><input type="checkbox" value="150"> 150s（大路口）</label>
          <label style="display:block;font-size:13px;margin:4px 0;"><input type="checkbox" value="180"> 180s（超大路口）</label>
          <div id="custom-cycles" style="margin-top:4px;"></div>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <input type="number" id="custom-cycle-input" placeholder="自定义周期(秒)" min="30" max="360" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
          <button class="btn btn-outline" onclick="addCustomCycle()" style="width:auto;padding:6px 12px;margin:0;font-size:12px;">添加</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>仿真参数</h3>
      <div class="form-group">
        <label>车流量（辆）</label>
        <input type="number" id="param-vehicles" value="80" min="10" max="500">
      </div>
      <div class="form-group">
        <label>仿真时长（秒）</label>
        <input type="number" id="param-duration" value="120" min="30" max="600">
      </div>
      <div class="form-group">
        <label>随机种子</label>
        <input type="number" id="param-seed" value="42" min="0">
      </div>
      <div class="form-group">
        <label>显示 Top N</label>
        <input type="number" id="param-topn" value="5" min="1" max="20">
      </div>
      <button class="btn btn-primary" id="btn-run" onclick="runOptimization()">▶ 开始枚举优化</button>
      <div style="font-size:11px;color:var(--text-secondary);text-align:center;">
        候选数 = 组合数 × 周期数，耗时较长请耐心等待
      </div>
    </div>
  </div>

  <div id="content">
    <div id="result-area">
      <div class="empty">配置路口后点击"开始枚举优化"，结果将在此显示</div>
    </div>
  </div>
</div>

<div id="status-bar">
  <span class="dot" id="status-dot"></span>
  <span id="status-text">就绪</span>
</div>

<div id="toast"></div>

<script>
let state = {
  projectPath: '',
  projectInfo: null,
  intersection: null,
  isRunning: false
};

function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `${type} show`;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 3000);
}

function setStatus(status, msg) {
  const dot = document.getElementById('status-dot');
  dot.className = 'dot ' + status;
  document.getElementById('status-text').textContent = msg;
  document.getElementById('btn-run').disabled = status === 'running';
}

async function api(url, opts={}) {
  try {
    const res = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
    return await res.json();
  } catch(e) {
    return { error: '无法连接到服务器' };
  }
}

// ─── 路口加载 ──────────────────────────────────────────────
async function loadProjectIntersections() {
  const sel = document.getElementById('intersection-select');
  const path = document.getElementById('project-select').value;
  if (!path) { sel.innerHTML = '<option value="">-- 先选项目 --</option>'; return; }
  const data = await api('/api/projects/validate', { method:'POST', body: JSON.stringify({ project_path: path })});
  if (data.valid) {
    state.projectPath = path;
    state.projectInfo = data;
    sel.innerHTML = data.intersections.map(i => `<option value="${i.id}">${i.id} - ${i.name}</option>`).join('');
    // URL 指定了路口则自动选中
    const params = new URLSearchParams(window.location.search);
    const interFromUrl = params.get('intersection');
    if (interFromUrl && data.intersections.some(i => i.id === interFromUrl)) {
      sel.value = interFromUrl;
    }
    if (sel.value) loadIntersection(sel.value);
  }
}

async function loadIntersection(id) {
  const data = await api('/api/editor/load', {
    method:'POST', body: JSON.stringify({ project_path: state.projectPath, intersection_id: id })
  });
  if (data.success) {
    state.intersection = data.intersection;
    renderPhases();
    document.getElementById('import-badge').style.display = '';
    toast(`已加载路口: ${id} (${data.intersection.phases.length} 相位)`, 'success');
  } else {
    toast(data.error || '加载失败', 'error');
  }
}

// ─── 相位配置渲染 ─────────────────────────────────────────
function renderPhases() {
  const inter = state.intersection;
  const list = document.getElementById('phase-list');
  if (!inter || !inter.phases.length) {
    list.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;">请先选择路口</div>';
    return;
  }
  list.innerHTML = inter.phases.map((ph, i) => `
    <div class="phase-card">
      <div class="phase-head">
        <span class="phase-name">${i+1}. ${ph.name || '相位'+(i+1)}</span>
        <span class="phase-dur">当前 ${ph.green_time || 0}s (黄${ph.yellow_time||3}s + 红${ph.red_time||2}s)</span>
      </div>
      <div class="phase-row">
        <div class="field" style="flex:0 0 90px;">
          <label>模式</label>
          <select onchange="onModeChange(${i}, this.value)">
            <option value="enumerate">枚举</option>
            <option value="fixed">固定</option>
          </select>
        </div>
        <div class="field" id="fixed-field-${i}" style="display:none;">
          <label>固定绿灯(秒)</label>
          <input type="number" id="fixed-val-${i}" value="${ph.green_time || 20}" min="5">
        </div>
        <div class="field" id="range-fields-${i}">
          <label>最小绿灯(秒)</label>
          <input type="number" id="min-val-${i}" value="15" min="5">
        </div>
        <div class="field" id="range-field2-${i}">
          <label>最大绿灯(秒)</label>
          <input type="number" id="max-val-${i}" value="90" min="5">
        </div>
      </div>
    </div>
  `).join('');
}

function onModeChange(idx, mode) {
  document.getElementById(`fixed-field-${idx}`).style.display = mode === 'fixed' ? '' : 'none';
  document.getElementById(`range-fields-${idx}`).style.display = mode === 'fixed' ? 'none' : '';
  document.getElementById(`range-field2-${idx}`).style.display = mode === 'fixed' ? 'none' : '';
}

// 添加自定义目标周期
function addCustomCycle() {
  const input = document.getElementById('custom-cycle-input');
  const val = parseInt(input.value);
  if (!val || val < 30 || val > 360) { toast('请输入 30~360 之间的周期值', 'error'); return; }
  // 检查是否已存在
  const exists = Array.from(document.querySelectorAll('#custom-cycles input')).some(c => parseInt(c.value) === val)
    || Array.from(document.querySelectorAll('#cycle-options input[type=checkbox]:not(#custom-cycles)')).some(c => parseInt(c.value) === val);
  if (exists) { toast(`周期 ${val}s 已存在`, 'info'); return; }
  const chip = document.createElement('label');
  chip.style.cssText = 'display:block;font-size:13px;margin:4px 0;color:var(--primary);';
  chip.innerHTML = `<input type="checkbox" value="${val}" checked onchange="this.parentElement.remove();if(this.checked===false){}"> ${val}s（自定义） <span style="color:var(--danger);cursor:pointer;" onclick="event.preventDefault();this.parentElement.remove()">✕</span>`;
  document.getElementById('custom-cycles').appendChild(chip);
  input.value = '';
  toast(`已添加目标周期 ${val}s`, 'success');
}

// ─── 优化运行 ─────────────────────────────────────────────
function buildPhaseConstraints() {
  const constraints = {};
  const inter = state.intersection;
  if (!inter) return null;
  for (let i = 0; i < inter.phases.length; i++) {
    const mode = document.querySelector(`#phase-list .phase-card:nth-child(${i+1}) select`).value;
    if (mode === 'fixed') {
      constraints[i] = { mode: 'fixed', value: parseInt(document.getElementById(`fixed-val-${i}`).value) || 20 };
    } else {
      constraints[i] = {
        mode: 'range',
        min: parseInt(document.getElementById(`min-val-${i}`).value) || 15,
        max: parseInt(document.getElementById(`max-val-${i}`).value) || 90
      };
    }
  }
  return constraints;
}

async function runOptimization() {
  if (!state.intersection) { toast('请先选择路口', 'error'); return; }
  if (state.isRunning) return;
  state.isRunning = true;

  const cycles = Array.from(document.querySelectorAll('#cycle-options input:checked')).map(c => parseInt(c.value));
  if (!cycles.length) { toast('请至少选择一个目标周期', 'error'); state.isRunning = false; return; }

  const phaseConstraints = buildPhaseConstraints();
  const payload = {
    project_path: state.projectPath,
    intersection_id: state.intersection.id,
    total_vehicles: parseInt(document.getElementById('param-vehicles').value) || 80,
    duration: parseInt(document.getElementById('param-duration').value) || 120,
    seed: parseInt(document.getElementById('param-seed').value) || 42,
    step: parseInt(document.getElementById('param-step').value) || 15,
    target_cycles: cycles,
    top_n: parseInt(document.getElementById('param-topn').value) || 5,
    phase_constraints: phaseConstraints
  };

  setStatus('running', '正在优化... 每个候选需运行一次仿真，请耐心等待');
  document.getElementById('result-area').innerHTML = `
    <div class="panel"><div class="panel-body" style="text-align:center;padding:40px;">
      <div style="font-size:18px;margin-bottom:8px;">⏳ 优化运行中...</div>
      <div style="font-size:13px;color:var(--text-secondary);">正在枚举配时方案并逐个运行 SUMO 仿真评估，预计需数分钟。</div>
    </div></div>`;

  const data = await api('/api/optimization/run', { method:'POST', body: JSON.stringify(payload) });
  state.isRunning = false;

  if (data.success) {
    setStatus('done', `优化完成：评估 ${data.total_evaluated} 个候选`);
    renderResults(data);
  } else {
    setStatus('done', '优化失败');
    toast(data.error || '优化失败', 'error');
    document.getElementById('result-area').innerHTML = `<div class="panel"><div class="panel-body" style="color:var(--danger);">${data.error || '优化失败'}</div></div>`;
  }
}

// ─── 评分公式说明 ─────────────────────────────────────────
function formulaPanel() {
  return `
  <div class="panel">
    <div class="panel-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none' ? '' : 'none'">
      <h3>📐 评分公式说明</h3><span style="font-size:12px;color:var(--text-secondary);cursor:pointer;">点击折叠</span>
    </div>
    <div class="panel-body" style="font-size:12px;line-height:2;color:var(--text-secondary);">
      <div style="font-size:14px;color:var(--text);font-weight:700;margin-bottom:4px;">Score = Efficiency<sup>0.5</sup> × Stability<sup>0.3</sup> × Fairness<sup>0.2</sup></div>
      <div>　<font style="color:#27ae60;">效率</font> = 几何平均(完成率, 吞吐, LOS) × √(P95延误惩罚)</div>
      <div>　<font style="color:#2980b9;">稳定</font> = 几何平均(跨周期得分, 溢出惩罚) × √(瓶颈惩罚)</div>
      <div>　<font style="color:#8e44ad;">公平</font> = (1 − 基尼系数) × (1 − 0.5 × 进口间最大差距)</div>
      <div style="margin-top:4px;color:#c0940c;">硬性筛选（一票否决）：LOS F（延误>80s）｜完成率<60%｜任一进口等待>4周期</div>
      <div style="margin-top:4px;color:var(--text-secondary);">所有候选共用同一份车流（固定种子），差异纯粹来自配时方案，保证公平比较。</div>
    </div>
  </div>`;
}

// ─── 结果渲染 ─────────────────────────────────────────────
// 排序状态
let sortState = { key: 'score', asc: false };
let resultData = null;

function renderResults(data) {
  const area = document.getElementById('result-area');
  // 仅在新数据到达时重置排序，避免 sortResults 重绘时丢失排序状态
  if (resultData !== data) {
    sortState = { key: 'score', asc: false };
  }
  resultData = data;
  const best = data.best;

  let html = '';

  // 评分公式说明
  html += formulaPanel();

  // 最优方案卡片
  if (best) {
    html += `
    <div class="panel">
      <div class="panel-header"><h3>🏆 最优配时方案</h3><span class="badge ${best.passed ? 'badge-good' : 'badge-bad'}">评分 ${best.score}</span></div>
      <div class="panel-body">
        <div style="font-size:14px;line-height:2;">
          <div><b>方案：</b>${best.desc}${best.is_baseline ? ' <span class="badge badge-base">基线</span>' : ''}</div>
          <div><b>周期：</b>${best.cycle_time}s　<b>是否通过硬筛选：</b>${best.passed ? '通过' : '未通过'}</div>
          ${best.reasons && best.reasons.length ? `<div style="color:var(--danger);">淘汰原因：${best.reasons.join('；')}</div>` : ''}
          ${best.overall_stats ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">
            车辆数 ${best.overall_stats.total_vehicles}，完成率 ${best.overall_stats.completion_rate}%，平均等待 ${best.overall_stats.avg_wait_time}s，平均速度 ${best.overall_stats.avg_speed} km/h
          </div>` : ''}
        </div>
      </div>
    </div>`;
  }

  // Top N 表格（点击表头排序）
  const arrow = (key) => sortState.key === key ? (sortState.asc ? ' ▲' : ' ▼') : '';
  html += `
  <div class="panel">
    <div class="panel-header"><h3>候选方案排名</h3><span style="font-size:12px;color:var(--text-secondary);">点击表头排序 · 点击行查看详细指标</span></div>
    <div class="panel-body" style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th onclick="sortResults('score')" style="cursor:pointer;">评分${arrow('score')}</th>
          <th onclick="sortResults('cycle')" style="cursor:pointer;">周期(s)${arrow('cycle')}</th>
          <th onclick="sortResults('efficiency')" style="cursor:pointer;">综合效率${arrow('efficiency')}</th>
          <th onclick="sortResults('stability')" style="cursor:pointer;">稳定性${arrow('stability')}</th>
          <th onclick="sortResults('fairness')" style="cursor:pointer;">公平性${arrow('fairness')}</th>
          <th>配时方案</th>
        </tr></thead>
        <tbody>
          ${sortCandidates(data.candidates).map((c, idx) => `
          <tr class="candidate-row" onclick="toggleDetail('cand-detail-${c._sortIdx}')">
            <td>${idx+1}${c.is_baseline ? ' <span class="badge badge-base">基线</span>' : ''}<div class="score-bar"><div class="fill" style="width:${c.score*100}%"></div></div></td>
            <td>${c.cycle_time}</td>
            <td>${c.metrics && c.metrics.efficiency != null ? c.metrics.efficiency.toFixed(3) : '—'}</td>
            <td>${c.metrics && c.metrics.stability != null ? c.metrics.stability.toFixed(3) : '—'}</td>
            <td>${c.metrics && c.metrics.fairness != null ? c.metrics.fairness.toFixed(3) : '—'}</td>
            <td>${c.desc}</td>
          </tr>
          <tr id="cand-detail-${c._sortIdx}" style="display:none;">
            <td colspan="6" class="detail-block">
              ${c.passed ? '' : `<div style="color:var(--danger);">❌ 未通过硬筛选：${(c.reasons||[]).join('；')}</div>`}
              <div><b>绿灯分配：</b>${(c.green_times||[]).map((g,i)=>`相位${i+1}=${g}s`).join('，')}</div>
              ${c.overall_stats ? `<div><b>总体指标：</b>车辆 ${c.overall_stats.total_vehicles}，完成率 ${c.overall_stats.completion_rate}%，平均等待 ${c.overall_stats.avg_wait_time}s，平均每车每路口 ${c.overall_stats.avg_wait_per_intersection}s，平均速度 ${c.overall_stats.avg_speed}km/h，平均延误 ${c.overall_stats.avg_time_loss}s</div>` : ''}
            </td>
          </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  area.innerHTML = html;
}

function sortCandidates(cands) {
  // 缓存原始索引用于详情行 id
  const withIdx = cands.map((c, i) => ({ ...c, _sortIdx: i }));
  const key = sortState.key;
  const dir = sortState.asc ? 1 : -1;
  withIdx.sort((a, b) => {
    let va, vb;
    if (key === 'score') { va = a.score; vb = b.score; }
    else if (key === 'cycle') { va = a.cycle_time; vb = b.cycle_time; }
    else {
      va = a.metrics && a.metrics[key] != null ? a.metrics[key] : -1;
      vb = b.metrics && b.metrics[key] != null ? b.metrics[key] : -1;
    }
    return (va - vb) * dir;
  });
  return withIdx;
}

function sortResults(key) {
  if (!resultData) return;
  if (sortState.key === key) {
    sortState.asc = !sortState.asc;
  } else {
    sortState.key = key;
    sortState.asc = false;
  }
  renderResults(resultData);
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

// ─── 事件绑定与初始化 ─────────────────────────────────────
document.getElementById('project-select').addEventListener('change', () => loadProjectIntersections());
document.getElementById('intersection-select').addEventListener('change', (e) => {
  if (e.target.value) loadIntersection(e.target.value);
});

async function init() {
  const params = new URLSearchParams(window.location.search);
  const projectFromUrl = params.get('project');
  if (projectFromUrl) {
    // 通过 URL 导入：在主页面下拉中匹配
    const sel = document.getElementById('project-select');
    let matched = false;
    for (const opt of sel.options) {
      if (opt.value === projectFromUrl) { sel.value = projectFromUrl; matched = true; break; }
    }
    if (!matched) {
      // 手动加一个 option
      const opt = document.createElement('option');
      opt.value = projectFromUrl;
      opt.textContent = projectFromUrl;
      sel.appendChild(opt);
      sel.value = projectFromUrl;
    }
  }
  await loadProjectIntersections();
}

init();
</script>
</body>
</html>
